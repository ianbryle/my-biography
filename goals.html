<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me | Vision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a13;
      --surface: #111827;
      --surface-glass: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-cyan: #38bdf8;
      --accent-indigo: #6366f1;
      --glow: rgba(56, 189, 248, 0.15);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.06) 0%, transparent 40%);
      line-height: 1.7;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-wrap {
      width: min(650px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--accent-cyan);
      transition: transform 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(-4px);
      text-decoration: underline;
    }

    .section-heading {
      margin-bottom: 32px;
    }

    .section-heading h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f3f4f6 30%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-heading p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .profile-card {
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-indigo));
      opacity: 0.7;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--glow);
    }

    .card-label {
      margin: 0 0 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .profile-card h3 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="page-wrap">
    <!-- Link back to index -->
    <a href="project2.html" class="back-btn">← Back</a>

    <div class="section-heading">
      <h1>About Me</h1>
      <p>My core vision as a BSIT student.</p>
    </div>

    <article class="profile-card">
      <p class="card-label">01 // VISION</p>
      <h3>Tech Innovation & Purpose</h3>
      <p>Lorem Ipsum is a placeholder text derived from a 1st-century BC Latin text by Cicero, used to fill space in design and publishing without meaningful content.</p>
    </article>
  </main>
</body>
</html>
