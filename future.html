<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Goals</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(-45deg, #091326, #0f2040, #1a3a66, #112847);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0ffe0;
            padding: 40px 20px;
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Background Gradient Animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(15, 32, 64, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 45px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 153, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 153, 0.05);
            animation: fadeInContainer 1s cubic-bezier(0.16, 1, 0.3, 1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 255, 153, 0.12);
        }

        @keyframes fadeInContainer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #00ff99;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            border-bottom: 2px solid rgba(0, 255, 153, 0.3);
            padding-bottom: 15px;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 153, 0.3);
            transition: text-shadow 0.3s ease;
        }

        h1:hover {
            text-shadow: 0 0 20px rgba(0, 255, 153, 0.8);
        }

        .img-container {
            display: flex;
            justify-content: center;
        }

        img {
            display: block;
            width: 300px;
            max-width: 100%;
            height: auto;
            margin: 15px auto 30px;
            border-radius: 12px;
            border: 4px solid #00ff99;
            box-shadow: 0 0 20px rgba(0, 255, 153, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        img:hover {
            transform: scale(1.04) rotate(1deg);
            border-color: #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.5);
        }

        p {
            color: #ffcc00;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #ffcc00;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        p:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.35);
        }

        .back-container {
            text-align: center;
            margin-top: 40px;
        }

        a {
            display: inline-block;
            text-align: center;
            color: #00ccff;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 25px;
            background: rgba(0, 204, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 204, 255, 0.3);
            transition: all 0.3s ease;
        }

        a:hover {
            background: #00ccff;
            color: #0f2040;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 204, 255, 0.4);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Future Goals</h1>
        
        <div class="img-container">
            <img src="f.jpg" alt="Future Goals">
        </div>
        
        <p>
            In the future, I want to become a successful IT professional and build a meaningful career in the technology field. My goal is to use my knowledge and skills to help solve problems through technology and create useful solutions for people.
        </p>

        <div class="back-container">
            <a href="main.html">← Back to My Biography</a>
        </div>

    </div>

</body>

</html>
